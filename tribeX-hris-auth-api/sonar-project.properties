# SonarCloud scanner configuration.
# sonar.projectKey and sonar.organization are injected by the CI pipeline via secrets —
# do not hardcode them here to avoid conflicts with the central workflow's CLI args.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sources=apps,libs
sonar.tests=apps,libs,tests
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/main.ts,**/*.module.ts,**/dto/**
